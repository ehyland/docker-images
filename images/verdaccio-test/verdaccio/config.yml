storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

listen:
  - 0.0.0.0:48733

web:
  title: Verdaccio

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd

# Use JWT tokens so this test image can use a static auth token. The token
# printed by the `auth` and `npmrc` commands in docker/entrypoint.sh is
# signed with the static secret defined there.
security:
  api:
    jwt:
      sign:
        expiresIn: 10y
      verify: {}

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    maxage: 60m

packages:
  '@*/*':
    access: $all
    publish: $all
    unpublish: $authenticated
    proxy: npmjs

  '**':
    access: $all
    publish: $all
    unpublish: $authenticated
    proxy: npmjs

server:
  keepAliveTimeout: 60

middlewares:
  audit:
    enabled: true

# log settings
logs: { type: stdout, format: pretty, level: http }
